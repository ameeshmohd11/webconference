<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Video Calls</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #7c6aff;
    --accent2: #00e5c3;
    --danger: #ff4f6a;
    --text: #e8e8f0;
    --muted: #5a5a7a;
    --glass: rgba(255,255,255,0.04);
    --glow: 0 0 30px rgba(124,106,255,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 10% 20%, rgba(124,106,255,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 90% 80%, rgba(0,229,195,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── SCREENS ─── */
  .screen { position: absolute; inset: 0; z-index: 1; display: none; flex-direction: column; align-items: center; justify-content: center; }
  .screen.active { display: flex; }

  /* ─── LOBBY ─── */
  #lobby {
    gap: 40px;
    padding: 40px;
    animation: fadeIn .5s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .logo {
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    letter-spacing: .3em;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  h1 {
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    font-weight: 800;
    text-align: center;
    line-height: 1.1;
    letter-spacing: -.02em;
  }
  h1 span { color: var(--accent); }

  .preview-wrap {
    position: relative;
    width: min(340px, 90vw);
    aspect-ratio: 4/3;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0d0d16;
    box-shadow: var(--glow);
  }
  #localPreview {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  .preview-label {
    position: absolute;
    bottom: 12px; left: 12px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--accent2);
    background: rgba(0,0,0,.6);
    padding: 4px 8px;
    border-radius: 4px;
    backdrop-filter: blur(4px);
  }
  .cam-off-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    background: #0d0d16;
    color: var(--muted);
    font-size: 13px;
    font-family: 'DM Mono', monospace;
  }
  .cam-off-overlay svg { opacity: .4; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card-title {
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    letter-spacing: .2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .input-row { display: flex; gap: 10px; }

  input[type="text"] {
    flex: 1;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: border-color .2s;
  }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:focus { border-color: var(--accent); }

  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .05em;
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 20px rgba(124,106,255,.35);
  }
  .btn-primary:hover { background: #9080ff; transform: translateY(-1px); }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-full { width: 100%; text-align: center; }

  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; font-family: 'DM Mono', monospace; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ─── CALL ROOM ─── */
  #room {
    flex-direction: column;
    padding: 0;
    justify-content: flex-start;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(17,17,24,.8);
    backdrop-filter: blur(10px);
    z-index: 10;
    width: 100%;
    flex-shrink: 0;
  }
  .room-id {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .room-id strong { color: var(--accent2); }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #2a2a3a;
    transition: all .4s;
  }
  .status-dot.connecting { background: #ffb347; box-shadow: 0 0 8px #ffb347; animation: pulse 1s infinite; }
  .status-dot.connected { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); animation: none; }
  .timer {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    min-width: 60px;
    text-align: right;
  }

  /* Video grid */
  .video-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
    gap: 8px;
    padding: 12px;
    overflow: hidden;
    min-height: 0;
  }
  .video-grid.two-up {
    grid-template-columns: 1fr 1fr;
  }

  .video-tile {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    min-height: 0;
  }
  .video-tile video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .video-tile.local video { transform: scaleX(-1); }

  .tile-label {
    position: absolute;
    bottom: 10px; left: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: .08em;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(6px);
    padding: 4px 10px;
    border-radius: 6px;
    color: var(--text);
    display: flex; align-items: center; gap: 6px;
  }
  .mute-badge {
    width: 14px; height: 14px;
    display: none;
  }
  .mute-badge.show { display: block; }

  .tile-avatar {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface);
    font-size: clamp(2rem, 8vw, 5rem);
    display: none;
  }
  .tile-avatar.show { display: flex; }

  /* PiP local video in corner when remote is present */
  .pip-local {
    position: absolute;
    bottom: 70px; right: 16px;
    width: 160px;
    aspect-ratio: 4/3;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    z-index: 5;
    cursor: grab;
    display: none;
  }
  .pip-local.show { display: block; }
  .pip-local video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

  /* Controls bar */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px;
    background: rgba(17,17,24,.9);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--glass);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    position: relative;
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(124,106,255,.1); }
  .ctrl-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 16px rgba(124,106,255,.4); }
  .ctrl-btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; box-shadow: 0 4px 16px rgba(255,79,106,.4); }
  .ctrl-btn.danger:hover { background: #ff6b83; }
  .ctrl-btn svg { width: 20px; height: 20px; }
  .ctrl-label {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    white-space: nowrap;
    pointer-events: none;
  }

  .ctrl-sep { width: 1px; height: 32px; background: var(--border); margin: 0 4px; }

  /* Toast */
  #toast {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    z-index: 100;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* Chat panel */
  .chat-panel {
    position: fixed;
    right: -340px;
    top: 0; bottom: 0;
    width: 320px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 20;
    transition: right .3s cubic-bezier(.4,0,.2,1);
  }
  .chat-panel.open { right: 0; }
  .chat-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .chat-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
  .chat-close:hover { color: var(--text); }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .msg { font-size: 13px; line-height: 1.5; }
  .msg-meta { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); margin-bottom: 3px; }
  .msg-text { background: var(--glass); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); }
  .msg.mine .msg-text { background: rgba(124,106,255,.12); border-color: rgba(124,106,255,.25); }
  .msg.mine { align-items: flex-end; display: flex; flex-direction: column; }
  .chat-input-row {
    display: flex; gap: 8px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
  }
  .chat-input-row input {
    flex: 1;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
  }
  .chat-input-row input:focus { border-color: var(--accent); }
  .chat-send {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    padding: 0 14px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    transition: background .2s;
  }
  .chat-send:hover { background: #9080ff; }

  /* Waiting state */
  .waiting-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    background: var(--surface);
    border-radius: 14px;
  }
  .waiting-overlay h3 { font-size: 16px; }
  .waiting-overlay p { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); text-align: center; }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 560px) {
    .video-grid.two-up { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .pip-local { width: 110px; }
  }
</style>
</head>
<body>

<!-- ─── LOBBY ─── -->
<div class="screen active" id="lobby">
  <div class="logo"><div class="logo-dot"></div> NEXUS CALLS</div>

  <h1>Talk <span>face to face</span>,<br>no sign-up needed.</h1>

  <div class="preview-wrap">
    <video id="localPreview" autoplay muted playsinline></video>
    <div class="cam-off-overlay" id="previewOff" style="display:none">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 16L8 8M3 3l18 18M10.68 10.68A2 2 0 0 0 10 12a2 2 0 0 0 2 2 2 2 0 0 0 1.32-.68M12 6a6 6 0 0 1 6 6c0 .34-.03.67-.08 1M3 12a9 9 0 0 0 9 9 9 9 0 0 0 6.36-2.64"/></svg>
      Camera off
    </div>
    <div class="preview-label">● PREVIEW</div>
  </div>

  <div class="card">
    <div class="card-title">Start a new room</div>
    <button class="btn btn-primary btn-full" id="createBtn">Create room</button>

    <div class="divider">or join existing</div>

    <div class="card-title">Join with room ID</div>
    <div class="input-row">
      <input type="text" id="roomInput" placeholder="nexus-xxxx-xxxx" maxlength="20" />
      <button class="btn btn-outline" id="joinBtn">Join</button>
    </div>
  </div>
</div>

<!-- ─── ROOM ─── -->
<div class="screen" id="room">
  <!-- Top bar -->
  <div class="topbar">
    <div class="room-id">
      <div class="status-dot" id="statusDot"></div>
      Room: <strong id="roomLabel">—</strong>
      <button onclick="copyRoomId()" style="background:none;border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;cursor:pointer;letter-spacing:.05em;" title="Copy">COPY</button>
    </div>
    <div class="timer" id="callTimer">00:00</div>
  </div>

  <!-- Video -->
  <div class="video-grid" id="videoGrid">
    <!-- Remote tile (main) -->
    <div class="video-tile" id="remoteTile">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="tile-avatar" id="remoteAvatar">🧑‍💻</div>
      <div class="tile-label">
        <svg class="mute-badge" id="remoteMuteBadge" viewBox="0 0 24 24" fill="none" stroke="#ff4f6a" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
        Remote
      </div>
      <div class="waiting-overlay" id="waitingOverlay">
        <div class="spinner"></div>
        <h3>Waiting for someone…</h3>
        <p id="waitingRoomId">Share your room ID to invite</p>
      </div>
    </div>
  </div>

  <!-- PiP local -->
  <div class="pip-local" id="pipLocal">
    <video id="pipVideo" autoplay muted playsinline></video>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div style="position:relative">
      <button class="ctrl-btn active" id="micBtn" title="Toggle mic" onclick="toggleMic()">
        <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <span class="ctrl-label">Mic</span>
    </div>
    <div style="position:relative">
      <button class="ctrl-btn active" id="camBtn" title="Toggle camera" onclick="toggleCam()">
        <svg id="camIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </button>
      <span class="ctrl-label">Camera</span>
    </div>
    <div style="position:relative">
      <button class="ctrl-btn" id="screenBtn" title="Share screen" onclick="toggleScreen()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      </button>
      <span class="ctrl-label">Screen</span>
    </div>
    <div class="ctrl-sep"></div>
    <div style="position:relative">
      <button class="ctrl-btn" id="chatBtn" title="Chat" onclick="toggleChat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="ctrl-label">Chat</span>
      </button>
    </div>
    <div style="position:relative">
      <button class="ctrl-btn" title="Copy invite" onclick="copyRoomId()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="ctrl-label">Invite</span>
      </button>
    </div>
    <div class="ctrl-sep"></div>
    <div style="position:relative">
      <button class="ctrl-btn danger" title="Leave call" onclick="leaveCall()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07C9.44 17.29 7.76 15.32 6.68 13"/><path d="M6.67 4.67L19.31 17.3"/><path d="M3 3l18 18"/></svg>
        <span class="ctrl-label">Leave</span>
      </button>
    </div>
  </div>
</div>

<!-- Chat panel -->
<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    Messages
    <button class="chat-close" onclick="toggleChat()">×</button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="Type a message…" maxlength="300" onkeydown="if(event.key==='Enter')sendChat()" />
    <button class="chat-send" onclick="sendChat()">Send</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Socket.io client library for WebSocket signaling -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<!-- WebSocket signaling with real backend -->
<script src="client.js"></script>
</body>
</html>
